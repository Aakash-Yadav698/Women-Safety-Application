spring.application.name=women-safety-backend

# ---------- MySQL ----------
# createDatabaseIfNotExist=true means you do NOT need to manually create
# the schema in MySQL Workbench first - Spring will do it on startup.
spring.datasource.url=jdbc:mysql://localhost:3306/women_safety_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE

# ddl-auto=update -> Hibernate reads your @Entity classes and creates/updates
# the matching tables automatically. No manual CREATE TABLE needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# 256-bit (32+ char) secret used to sign tokens. Change this to your own
# random string before you ever deploy this anywhere real.
jwt.secret=women-safety-super-secret-key-change-this-before-deploy-123456
# token lifetime in milliseconds -> 24 hours
jwt.expiration-ms=86400000

# ---------- Twilio (SMS) ----------
# Get these from twilio.com/console after free signup
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.from-number=YOUR_TWILIO_PHONE_NUMBER

# ---------- Google Maps (reverse geocoding) ----------
# Optional - if left blank, SOS alerts will just store raw lat/long instead
# of a human-readable address. Get a key from console.cloud.google.com
google.maps.api-key=YOUR_GOOGLE_MAPS_API_KEY
